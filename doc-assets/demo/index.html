<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pagewalker demo</title>
<!--
  A page for the sample scenario of pagewalker (01_sample_scenario.js).

  It is intentionally built with plain HTML: the form is submitted by the browser itself,
  so that no element is shown before it becomes operable. A scenario against this page
  never breaks by someone else's change, unlike one against a real world site.
-->
<style>
  body { font-family: sans-serif; margin: 0 auto; padding: 2em 1em; max-width: 40em; line-height: 1.6; }
  h1 { border-bottom: 2px solid #4a90d9; padding-bottom: .3em; }
  label { display: block; margin: 1.2em 0 .3em; font-weight: bold; }
  input[type=text], select { width: 100%; padding: .5em; font-size: 1em; box-sizing: border-box; }
  .checkbox { margin-top: 1.2em; font-weight: normal; }
  .checkbox input { margin-right: .5em; }
  button { margin-top: 1.5em; padding: .6em 1.8em; font-size: 1em; color: #fff;
           background: #4a90d9; border: none; border-radius: 3px; cursor: pointer; }
  button:hover { background: #3a7bc0; }
</style>
</head>
<body>

<h1>pagewalker demo</h1>

<p>This page is operated by the sample scenario of
   <a href="https://github.com/xketanaka/pagewalker">pagewalker</a>.</p>

<form method="GET" action="result.html">

  <label for="username">User name</label>
  <input type="text" id="username" name="username" placeholder="your name">

  <label for="plan">Plan</label>
  <select id="plan" name="plan">
    <option value="Free">Free</option>
    <option value="Standard">Standard</option>
    <option value="Premium">Premium</option>
  </select>

  <label class="checkbox" for="newsletter">
    <input type="checkbox" id="newsletter" name="newsletter" value="yes">
    Subscribe to the newsletter
  </label>

  <button type="submit">Sign up</button>
</form>

</body>
</html>
