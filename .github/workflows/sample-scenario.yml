name: Sample Scenario Smoke Test

# Weekly smoke test of the "new user journey":
# scaffold a project with init-pagewalker-project (published npm package),
# and run the sample scenario
#
on:
  schedule:
    - cron: '0 0 * * 1'   # every Monday 00:00 UTC (09:00 JST)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    name: Scaffold and run sample scenario
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libnss3 libasound2t64 libgbm-dev
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Scaffold a new pagewalker project (as a new user would)
        run: |
          mkdir smoke && cd smoke
          npx --yes --package=pagewalker -- init-pagewalker-project
          npm install
      - name: Run the sample scenario against github.com
        run: cd smoke && npm test -- --silent
      - name: Debug - capture how github.com looks from the CI runner
        if: failure()
        run: |
          cd smoke
          cat > debug-capture.js <<'EOF'
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          (async () => {
            const browser = await puppeteer.launch({ headless: true, args: ['--no-sandbox'] });
            const page = await browser.newPage();
            await page.setViewport({ width: 1024, height: 768 });
            await page.goto('https://github.com/xketanaka/pagewalker', { waitUntil: 'networkidle2' });
            fs.writeFileSync('debug-page.html', await page.content());
            await page.screenshot({ path: 'debug-page.png', fullPage: true });
            const info = {
              url: page.url(),
              title: await page.title(),
              hasSearchButton: await page.evaluate(() => !!document.querySelector('button[aria-label^="Search or jump to"]')),
              buttonAriaLabels: await page.evaluate(() => Array.from(document.querySelectorAll('button')).map(b => b.getAttribute('aria-label')).filter(Boolean).slice(0, 30)),
              bodyTextSnippet: await page.evaluate(() => document.body.innerText.slice(0, 800)),
            };
            fs.writeFileSync('debug-info.json', JSON.stringify(info, null, 2));
            await browser.close();
          })().catch((e) => { fs.writeFileSync('debug-error.txt', String((e && e.stack) || e)); process.exit(0); });
          EOF
          node debug-capture.js
      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: github-page-debug
          path: |
            smoke/debug-page.html
            smoke/debug-page.png
            smoke/debug-info.json
            smoke/debug-error.txt
          if-no-files-found: ignore
      - name: Create an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Sample scenario smoke test failed (${new Date().toISOString().slice(0, 10)})`,
              body: [
                `週次スモークテストが失敗しました: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                ``,
                `01_sample_scenario.js が GitHub の UI 変更などで壊れている可能性があります。`,
              ].join('\n'),
            });
